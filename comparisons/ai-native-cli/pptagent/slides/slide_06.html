<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collapse the tree into two machine-friendly moves</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1280px;
            height: 720px;
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 60px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            margin-bottom: 40px;
            border-left: 6px solid #38BDF8;
            padding-left: 20px;
        }
        .title {
            font-size: 48px;
            font-weight: 700;
            color: #38BDF8;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 24px;
            color: #94A3B8;
            font-style: italic;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 40px;
        }
        .step {
            display: flex;
            align-items: center;
            background-color: #1E293B;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        .step-number {
            font-size: 64px;
            font-weight: 800;
            color: #22D3EE;
            margin-right: 40px;
            min-width: 80px;
        }
        .step-text {
            flex: 1;
        }
        .step-title {
            font-size: 32px;
            font-weight: 700;
            color: #F1F5F9;
            margin-bottom: 8px;
        }
        .step-desc {
            font-size: 24px;
            color: #94A3B8;
        }
        .page-number {
            position: absolute;
            bottom: 20px;
            right: 40px;
            color: #475569;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">Collapse the tree into two machine-friendly moves</h1>
        <h2 class="subtitle">Streamlining discovery for agents</h2>
    </div>
    <div class="content">
        <div class="step">
            <div class="step-number">01</div>
            <div class="step-text">
                <div class="step-title">List</div>
                <div class="step-desc">return a compact catalogue of every capability.</div>
            </div>
        </div>
        <div class="step">
            <div class="step-number">02</div>
            <div class="step-text">
                <div class="step-title">Inspect</div>
                <div class="step-desc">return complete details for fuzzy, related matches.</div>
            </div>
        </div>
    </div>
    <div class="page-number">06 / 11</div>
</body>
</html>
