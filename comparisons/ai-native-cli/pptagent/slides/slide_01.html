<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Native CLI: Give AI Its Own Manual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1280px;
            height: 720px;
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        /* Decorative background elements */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 2px 2px, #1E293B 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.5;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            padding: 40px;
        }
        .title {
            font-size: 72px;
            font-weight: 800;
            color: #38BDF8;
            margin-bottom: 24px;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 32px;
            font-weight: 400;
            color: #94A3B8;
            line-height: 1.4;
        }
        .highlight {
            color: #22D3EE;
        }
        .divider {
            width: 120px;
            height: 6px;
            background-color: #F43F5E;
            margin: 40px auto;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <h1 class="title">AI-Native CLI: <br>Give AI Its Own Manual</h1>
        <div class="divider"></div>
        <p class="subtitle">Products now serve two users: <span class="highlight">people</span> and the <span class="highlight">agents</span> acting for them.</p>
    </div>
</body>
</html>
