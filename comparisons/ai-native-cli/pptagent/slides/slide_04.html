<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People optimize for accuracy. AI optimizes for relevance.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1280px;
            height: 720px;
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 60px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            margin-bottom: 40px;
            border-left: 6px solid #38BDF8;
            padding-left: 20px;
        }
        .title {
            font-size: 48px;
            font-weight: 700;
            color: #38BDF8;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 24px;
            color: #94A3B8;
            font-style: italic;
        }
        .content {
            flex: 1;
            display: flex;
            gap: 40px;
            align-items: stretch;
            margin-top: 20px;
        }
        .card {
            flex: 1;
            background-color: #1E293B;
            border-radius: 16px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            border: 1px solid #334155;
            transition: transform 0.3s ease;
        }
        .card.person {
            border-top: 6px solid #3B82F6;
        }
        .card.ai {
            border-top: 6px solid #A855F7;
        }
        .card-label {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .person .card-label { color: #3B82F6; }
        .ai .card-label { color: #A855F7; }

        .quote {
            font-size: 32px;
            font-weight: 500;
            line-height: 1.4;
            color: #F1F5F9;
        }
        .page-number {
            position: absolute;
            bottom: 20px;
            right: 40px;
            color: #475569;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">People optimize for accuracy. AI optimizes for relevance.</h1>
        <h2 class="subtitle">Different needs, different journeys</h2>
    </div>
    <div class="content">
        <div class="card person">
            <div class="card-label">Person</div>
            <p class="quote">"I know the command. Give me the exact page."</p>
        </div>
        <div class="card ai">
            <div class="card-label">AI</div>
            <p class="quote">"Give me enough related context to plan and recover from a wrong guess."</p>
        </div>
    </div>
    <div class="page-number">04 / 11</div>
</body>
</html>
