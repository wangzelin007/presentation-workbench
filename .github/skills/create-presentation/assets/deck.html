<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{TITLE}}" />
    <title>{{TITLE}}</title>
  </head>
  <body>
    <main class="deck" aria-label="{{TITLE}}">
      <section class="slide slide--title">
        <div class="slide__content">
          <p class="eyebrow">PRESENTATION</p>
          <h1>{{TITLE}}</h1>
          <p>Add a concise promise for the audience.</p>
        </div>
      </section>

      <section class="slide">
        <div class="slide__content">
          <p class="eyebrow">THE OPPORTUNITY</p>
          <h2>Replace this with one clear assertion.</h2>
          <p>Support the assertion with only the evidence the audience needs.</p>
        </div>
      </section>

      <section class="slide slide--center">
        <div class="slide__content">
          <p class="eyebrow">NEXT STEP</p>
          <h2>Close with a specific action.</h2>
        </div>
      </section>
    </main>
    <script type="module" src="../../src/deck.ts"></script>
  </body>
</html>
